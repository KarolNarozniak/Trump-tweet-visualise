[build]
input_csv = "tweets_01-08-2021.csv"
output_dir = "data/processed"
min_mention_count = 1
global_min_mentions = 8
include_retweets = true
heat_decay = 0.85
layout_seed = 42

[truth_build]
input_path = "truthsocial.posts[Trump-FROM-10-8-25].txt"
output_dir = "data/processed_truth"
semantic_backend = "hf"
topic_model_id = "facebook/bart-large-mnli"
ner_model_id = "dslim/bert-base-NER"
sentiment_model_id = "cardiffnlp/twitter-roberta-base-sentiment-latest"
embedding_model_id = "sentence-transformers/all-MiniLM-L6-v2"
device = "auto"
batch_size = 16
topic_threshold = 0.35
max_topic_labels = 3
entity_score_threshold = 0.65
max_chunk_chars = 900
min_node_count = 8
included_node_types = ["topic", "per", "org", "loc", "hashtag", "mention"]
heat_decay = 0.85
layout_seed = 99

[unified_build]
twitter_input_csv = "tweets_01-08-2021.csv"
truth_input_path = "truthsocial.posts[Trump-FROM-10-8-25].txt"
output_dir = "data/processed_unified"
include_retweets = true
semantic_backend = "hf"
topic_model_id = "facebook/bart-large-mnli"
ner_model_id = "dslim/bert-base-NER"
sentiment_model_id = "cardiffnlp/twitter-roberta-base-sentiment-latest"
embedding_model_id = "sentence-transformers/all-MiniLM-L6-v2"
device = "auto"
batch_size = 16
topic_threshold = 0.35
max_topic_labels = 3
entity_score_threshold = 0.65
max_chunk_chars = 900
min_node_count = 8
included_node_types = ["topic", "per", "org", "loc", "hashtag", "mention"]
heat_decay = 0.85
layout_seed = 211

[app]
processed_dir = "data/processed"
include_hub = true
always_label_top_nodes = false
playback_speed = 8.0
node_size_multiplier = 2.0
layout_spread = 1.0
initial_zoom_boost = 0.8
graph_height_px = 1000

[truth_app]
processed_dir = "data/processed_truth"
include_retruths = true
node_types = ["topic", "per", "org", "loc"]
sentiment_filter = "all"
min_node_count = 8
playback_speed = 6.0
node_size_multiplier = 1.8
layout_spread = 1.15
initial_zoom_boost = 0.85
graph_height_px = 920

[semantic_app]
processed_dir = "data/processed_unified"
include_reposts = true
node_types = ["topic", "per", "org", "loc"]
sentiment_filter = "all"
min_node_count = 8
playback_speed = 6.0
node_size_multiplier = 1.8
layout_spread = 1.15
initial_zoom_boost = 0.9
graph_height_px = 920

[forecast_app]
semantic_processed_dir = "data/processed_unified"
processed_dir = "data/processed_forecast"
default_mode = "baseline"
horizon_weeks = 16
lookback_weeks = 12
node_types = ["topic", "per", "org", "loc"]
min_node_count = 8
playback_speed = 6.0
node_size_multiplier = 1.9
layout_spread = 1.15
initial_zoom_boost = 0.92
graph_height_px = 920

[forecast_train]
input_dir = "data/processed_unified"
output_dir = "data/processed_forecast"
device = "auto"
horizon_weeks = 16
lookback_weeks = 12
validation_weeks = 12
epochs = 30
hidden_dim = 32
learning_rate = 0.002
weight_decay = 0.00001
seed = 42

[runtime]
streamlit_host = "0.0.0.0"
streamlit_port = 3001
docs_host = "0.0.0.0"
docs_port = 3002
docs_url = "http://localhost:3002"
docs_site_dir = "docs-site"

[meta]
app_name = "Trump Graph"
logo_path = "logo.png"
data_source_url = "https://www.thetrumparchive.com/"
repository_url = "https://github.com/KarolNarozniak/Trump-tweet-visualise"
disclaimer_text = "Disclaimer: This visualization is a student educational project for studying time-dependent graph behavior. It is not intended as political endorsement, defamation, or factual/legal judgment about any person."
about_text = "Trump Graph is a student project focused on temporal network analysis. Its purpose is to explore how mentions and co-mentions evolve over time in archived tweet data. The project is purely educational."
